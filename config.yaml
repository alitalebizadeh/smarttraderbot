# ─────────────────────────────────────────────────────────────────────────────
# SmartTraderBot — config.yaml
# Main configuration file. All settings are read by main.py at startup.
# Edit this file to change symbols, timeframes, scan interval, and more.
# ─────────────────────────────────────────────────────────────────────────────

# ── Scanner settings ──────────────────────────────────────────────────────────
scanner:

  # Symbols to scan. Add or remove as needed.
  # Supported: Forex pairs, XAUUSD (Gold), US30 (Dow), NAS100 (Nasdaq), USOIL
  symbols:
    - XAUUSD

  # Timeframes to scan per symbol.
  # Valid values: M1, M5, M15, M30, H1, H4, D1, W1, MN
  timeframes:
    - M1

  # Seconds between scan cycles (loop mode only).
  # Minimum: 10. Recommended: 60 for M1, 300 for M5+
  interval_seconds: 60

  # Run mode:
  #   "test"  → scan only the first symbol and first timeframe (fast dev mode)
  #   "full"  → scan all configured symbols and timeframes
  run_mode: single


# ── Logging settings ──────────────────────────────────────────────────────────
logging:

  # Log level: DEBUG | INFO | WARNING | ERROR
  level: INFO

  # Write logs to a rotating file in addition to console output
  log_to_file: true

  # Directory for log files (created automatically if missing)
  log_dir: logs

  # Log filename (rotates at 5MB, keeps 3 backups)
  log_filename: smarttrader.log


# ── Dashboard settings ────────────────────────────────────────────────────────
dashboard:

  # Directory where dashboard.html is written
  output_dir: output_files

  # Output HTML filename
  filename: dashboard.html

  # Browser auto-refresh interval in seconds (0 = disabled)
  auto_refresh_seconds: 60

  # Page title shown in browser tab and dashboard header
  title: "SmartTraderBot — Market Scanner"


