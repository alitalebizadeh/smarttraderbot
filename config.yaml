dashboard:
  auto_refresh_seconds: 60
  filename: dashboard.html
  output_dir: output_files
  title: SmartTraderBot — Market Scanner
data:
  data_dir: data
  max_candles: 5000
  use_live_mt5: false
engines:
  cluster_tolerance_pips: 30.0
  displacement_body_atr: 1.0
  max_cluster_width_pct: 0.015
  max_zone_distance_atr: 3.0
logging:
  level: INFO
  log_dir: logs
  log_filename: smarttrader.log
  log_to_file: true
scanner:
  htf_timeframe: ''
  interval_seconds: 60
  max_workers: 1
  min_score_threshold: 0.0
  run_mode: single
  swing_length: 0
  symbols:
  - XAUUSD
  timeframes:
  - M1
